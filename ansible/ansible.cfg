[defaults]
host_key_checking = False
# The VM is brand new on first deploy, so its host key is unknown and a strict
# check would block the very first pipeline run with an interactive prompt.
# Acceptable here because the IP comes from a Jenkins credential, not from the
# network. Turn this back on for anything that outlives a course project.
interpreter_python = /usr/bin/python3
retry_files_enabled = False
stdout_callback = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=20
